name: Build and test
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - run: bash macos/build.sh
      - run: dist/Quota.app/Contents/MacOS/CodexQuotaIsland --self-test
      - run: dist/Quota.app/Contents/MacOS/CodexQuotaIsland --transport-test
      - run: ditto -c -k --sequesterRsrc --keepParent dist/Quota.app dist/Quota-macOS.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Quota-macOS
          path: dist/Quota-macOS.zip
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r windows/requirements.txt
      - run: python -m unittest discover -s windows/tests -v
      - run: python windows/smoke.py
        env:
          QT_QPA_PLATFORM: offscreen
      - run: ./windows/build.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: Quota-Windows-preview
          path: dist/Quota/
